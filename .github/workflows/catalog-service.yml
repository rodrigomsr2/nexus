name: catalog-service CI

on:
  push:
    branches: [main]
    paths:
      - 'catalog-service/**'
      - '.github/workflows/catalog-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'catalog-service/**'
      - '.github/workflows/catalog-service.yml'

env:
  SERVICE: catalog-service
  IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-catalog-service

jobs:
  build-test:
    name: Build & Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build & test
        run: ./gradlew :catalog-service:test :catalog-service:jacocoTestReport --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: catalog-service/build/reports/jacoco/test/jacocoTestReport.xml
          flags: catalog-service
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker Build & Push
    runs-on: self-hosted
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: catalog-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      - name: Output image tag
        run: echo "IMAGE_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
