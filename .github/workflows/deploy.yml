name: Deploy to k3s

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (ordersService | catalogService | logisticsService | apiGateway | frontend)'
        required: true
        type: choice
        options:
          - ordersService
          - catalogService
          - logisticsService
          - apiGateway
          - frontend
      tag:
        description: 'Image tag (e.g. sha-abc1234 or latest)'
        required: true
        default: 'latest'

jobs:
  deploy:
    name: Helm upgrade
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # Need write access to push the values.yaml change
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy ${{ inputs.service }}:${{ inputs.tag }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh "${{ inputs.service }}" "${{ inputs.tag }}"

      - name: Commit updated values.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/nexus/values.yaml
          git diff --cached --quiet || \
            git commit -m "chore(deploy): ${{ inputs.service }} -> ${{ inputs.tag }} [skip ci]"
          git push
