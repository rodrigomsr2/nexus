# ─── Image registry ──────────────────────────────────────────────────────────
# Replace YOUR_GITHUB_USER with your GitHub username before first deploy.
# deploy.sh updates the .image.tag fields automatically.

ordersService:
  image:
    repository: ghcr.io/rodrigomsr2/nexus-orders-service
    tag: latest
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

catalogService:
  image:
    repository: ghcr.io/rodrigomsr2/nexus-catalog-service
    tag: latest
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

logisticsService:
  image:
    repository: ghcr.io/rodrigomsr2/nexus-logistics-service
    tag: latest
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

apiGateway:
  image:
    repository: ghcr.io/rodrigomsr2/nexus-api-gateway
    tag: latest
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

frontend:
  image:
    repository: ghcr.io/rodrigomsr2/nexus-frontend
    tag: latest
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
