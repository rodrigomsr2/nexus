name: nexus-argocd CI

on:
  push:
    branches:
      - test/homelab-argocd
  pull_request:
    branches:
      - test/homelab-argocd

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nexus-argocd

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Build e testes
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build e testes
        run: ./gradlew build --no-daemon

      - name: Upload JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nexus-argocd-jar
          path: build/libs/nexus-argocd-*.jar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2 — Build e push da imagem Docker
  # Executa apenas em push (não em pull_request) para não publicar builds de PRs
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write  # necessário para push no ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag com SHA curto do commit — imutável, rastreável
            type=sha,prefix=sha-,format=short
            # Tag com nome do branch sanitizado
            type=ref,event=branch
            # Tag 'latest' apenas no branch principal de deploy
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/test/homelab-argocd' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Injeta ARGs para os labels OCI da imagem base
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
          # Cache de camadas entre runs — reduz tempo de build
          cache-from: type=gha
          cache-to: type=gha,mode=max
