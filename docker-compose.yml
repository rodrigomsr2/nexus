version: '3.9'

services:
  # ─── Infra ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexus-kafka-ui
    depends_on: [kafka]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nexus
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: nexus-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    command: start-dev --import-realm
    volumes:
      - ./infra/docker/keycloak-realm.json:/opt/keycloak/data/import/nexus-realm.json

  # ─── Microsserviços ──────────────────────────────────────
  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: nexus-orders
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nexus
      DB_USER: nexus_user
      DB_PASSWORD: nexus_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: nexus-orders
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: nexus
      KEYCLOAK_CLIENT_ID: nexus-backend
    ports:
      - "8081:8080"

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: nexus-catalog
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nexus
      DB_USER: nexus_user
      DB_PASSWORD: nexus_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL_MINUTES: 15
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: nexus
      KEYCLOAK_CLIENT_ID: nexus-backend
    ports:
      - "8082:8080"

  logistics-service:
    build:
      context: ./logistics-service
      dockerfile: Dockerfile
    container_name: nexus-logistics
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nexus
      DB_USER: nexus_user
      DB_PASSWORD: nexus_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: nexus-logistics
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: nexus
      KEYCLOAK_CLIENT_ID: nexus-backend
    ports:
      - "8083:8080"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: nexus-gateway
    depends_on:
      - orders-service
      - catalog-service
      - logistics-service
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: nexus
      ORDERS_SERVICE_URL: http://orders-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      LOGISTICS_SERVICE_URL: http://logistics-service:8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    depends_on: [api-gateway]
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080

volumes:
  postgres_data:
  redis_data:
